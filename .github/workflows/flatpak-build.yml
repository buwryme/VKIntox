name: Flatpak library build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder

      - name: Install matching Flatpak SDKs
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            runtime/org.gnome.Sdk/x86_64/50 \
            runtime/org.freedesktop.Sdk/x86_64/25.08 \
            runtime/org.freedesktop.Sdk.Extension.llvm21/x86_64/25.08

      - name: Build x86_64 library in the Flatpak SDK
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo="$RUNNER_TEMP/vkintox-flatpak-repo" \
            "$RUNNER_TEMP/vkintox-flatpak-build" \
            packaging/flatpak/org.freedesktop.Platform.VulkanLayer.VKIntox.json

      - name: Name library with build date
        run: |
          lib="$RUNNER_TEMP/vkintox-flatpak-build/files/lib/libvkintox.so"
          test -s "$lib"
          cp "$lib" "libvkintox_flatpak_$(date -u +'%d%m%Y').so"

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libvkintox-flatpak
          path: libvkintox_flatpak_*.so
          if-no-files-found: error
          retention-days: 30
