name: CI
on:
  push:
    branches: [main, master, v0.1.3-experimental, v0.2.0-experimental]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'setup'
      - 'meson.build'
      - 'meson_options.txt'
      - 'Justfile'
      - 'VERSION'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'setup'
      - 'meson.build'
      - 'meson_options.txt'
      - 'Justfile'
      - 'VERSION'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            glslang-tools \
            libvulkan-dev \
            libx11-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            meson \
            pkg-config \
            spirv-headers \
            wayland-protocols

      - name: Generate build inputs
        run: CC=clang CXX=clang++ meson setup --buildtype=release --prefix=/usr build

      - name: Build project and tests
        run: meson compile -C build

      - name: Run config serialization tests
        run: meson test -C build --print-errorlogs

      - name: Compile ReShade EffectPackages shaders
        run: python3 src/tests/test_reshade_shaders.py --shader-check build/src/vkintox-shader-check

      - name: Install smoke test dependencies
        run: |
          # xauth is named explicitly because it is only a Recommends of xvfb, and
          # --no-install-recommends leaves it out. xvfb-run shells out to xauth to
          # authorise the display it starts, so without it the wrapper dies before
          # vkcube ever runs and the step fails with nothing useful in the log.
          sudo apt-get install --no-install-recommends -y \
            mesa-vulkan-drivers \
            vulkan-tools \
            xauth \
            xvfb

      - name: Smoke test the layer under vkcube
        run: |
          # A runner has no GPU, so lavapipe supplies a software Vulkan
          # implementation, and xvfb supplies the display vkcube needs to open a
          # window. The script fails the build when the loader never picked up
          # the freshly built layer, so a green run cannot be a vacuous one where
          # the layer silently never loaded and vkcube ran untouched.
          command -v xauth >/dev/null || { echo "xauth missing; xvfb-run cannot work" >&2; exit 1; }
          # Two things vary by distro. Ubuntu ships an arch-independent
          # lvp_icd.json where Fedora ships lvp_icd.x86_64.json, so the pattern
          # must not require a suffix. And several distros ship i686 alongside
          # the native build, so a bare head -1 can pick the 32-bit driver and
          # then vkcube reports no compatible ICD. Prefer the native arch, fall
          # back to the unsuffixed one, and never take an i686 ICD.
          ICD_DIR=/usr/share/vulkan/icd.d
          LVP_ICD=""
          for candidate in "$ICD_DIR/lvp_icd.$(uname -m).json" "$ICD_DIR/lvp_icd.json"; do
            if [ -f "$candidate" ]; then LVP_ICD="$candidate"; break; fi
          done
          if [ -z "$LVP_ICD" ]; then
            LVP_ICD=$(ls "$ICD_DIR"/lvp_icd*.json 2>/dev/null | grep -v i686 | head -1)
          fi
          if [ -z "$LVP_ICD" ]; then
            echo "lavapipe ICD not found; mesa-vulkan-drivers did not install" >&2
            ls /usr/share/vulkan/icd.d/ >&2
            exit 1
          fi
          echo "using software vulkan: $LVP_ICD"
          VK_ICD_FILENAMES="$LVP_ICD" xvfb-run -a src/tests/smoke_vkcube.sh build/src/libvkintox.so 11

      - name: Report smoke test diagnostics
        if: failure()
        run: |
          # the script deliberately keeps its temp dir on failure, so print what it
          # found rather than leaving the next person with a bare red step
          for log in /tmp/tmp.*/vkcube.log; do
            [ -f "$log" ] || continue
            echo "=== $log ==="
            cat "$log"
          done
